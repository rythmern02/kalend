[package]
name = "kalend-transfer-hook"
version = "0.1.0"
description = "Institutional compliance transfer hook for Kalend PT/YT RWA tokens"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "kalend_transfer_hook"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2", features = ["token_2022", "token_2022_extensions"] }

[lints.rust]
unexpected_cfgs = { level = "allow" }
