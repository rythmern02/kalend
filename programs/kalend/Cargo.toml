[package]
name = "kalend"
version = "0.1.0"
description = "Private request-for-quote exchange for dated yield on Solana, settled through Chainlink CRE"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "kalend"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2", features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }
solana-hash = "4.4.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }
